
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Nathan's Organization</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo">
            <img src="images/leaf_logo.png" alt="Website logo">
            <span>Nathan's Organization</span>
        </a>
        
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="about.html">About & Contact</a>
        </nav>
    </header>

    <main class="signup-page">
        <section class="signup-card">
            <h1>Welcome back</h1>
            <p>Log in to manage your tasks and schedule.</p>

            <form class="signup-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="create-account-button">
                    Log in
                </button>
            </form>

            <p class="login-prompt">
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>

</body>
</html>
