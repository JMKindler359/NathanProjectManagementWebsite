
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Nathan's Organization</title>
    <link rel="stylesheet" href="./css/profile.css">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo">
            <img src="images/leaf_logo.png" alt="Website logo">
            <span>Nathan's Organization</span>
        </a>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="index.html#about-contact">About & Contact</a>
        </nav>
    </header>

    <main class="profile-page">
        <section class="profile-card">
            <div class="profile-heading">
                <img
                    src="images/blank_profile.png"
                    alt="Profile picture"
                    class="profile-picture"
                >
                <h1>My Profile</h1>
                <p>Manage your account information.</p>
            </div>

            <div class="profile-details">
                <div class="profile-field">
                    <span class="field-label">Name</span>
                    <p>Your name will appear here</p>
                </div>

                <div class="profile-field">
                    <span class="field-label">Email address</span>
                    <p>Your email will appear here</p>
                </div>
            </div>

            <div class="profile-actions">
                <a href="login.html" class="signup-button">Log in</a>
                <a href="index.html" class="back-link">Back to home</a>
            </div>
        </section>
    </main>

</body>
</html>
