<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan's Organization</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="top-bar">

    <link rel="stylesheet" href="style.css">
    <a href="#" class="logo">
        <img src="images/leaf_logo.png" alt="Website logo">
        <span>Nathan's Organization</span>
    </a>

    <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="calendar.html">Calendar</a>
        <a href="#about-contact">About & Contact</a>
    </nav>

    <a href="profile.html" class="profile-link">
        <img src="images/blank_profile.png" alt="View your profile">
    </a>

</header>


<main class="dashboard">
    <section class="welcome">
        <h1>Welcome to your dashboard</h1>
        <p>Here's what's coming up this week.</p>
    </section>

    <section class="dashboard-grid">
        <div class="todo-panel">
            <h2>To-do list</h2>
            <ul class="todo-list">
                <li>
                    <input type="checkbox" id="task1">
                    <label for="task1">Finish project outline</label>
                </li>
                <li>
                    <input type="checkbox" id="task2">
                    <label for="task2">Organize notes</label>
                </li>
                <li>
                        <input type="checkbox" id="task3">
                    <label for="task3">Review weekly schedule</label>
                </li>
            </ul>
            <button class="add-task-button" type="button">
                + Add a task
            </button>
        </div>

        <div class="upcoming-panel">
            <h2>Coming up this week</h2>
            <ul class="upcoming-list">
            <li>
                <div class="upcoming-date">
                    <span>MON</span>
                    <strong>12</strong>
                </div>
                <div class="upcoming-details">
                    <h3>Finish project outline</h3>
                    <p>9:00 AM</p>
                </div>
            </li>
            <li>
                <div class="upcoming-date">
                    <span>WED</span>
                    <strong>14</strong>
                </div>
                <div class="upcoming-details">
                    <h3>Review weekly schedule</h3>
                    <p>2:00 PM</p>
                </div>
            </li>
            <li>
                <div class="upcoming-date">
                    <span>FRI</span>
                    <strong>16</strong>
                </div>
                <div class="upcoming-details">
                    <h3>Submit project</h3>
                    <p>11:00 AM</p>
                </div>
            </li>
            </ul> 
        </div>
    </section>
</main>

</body>
