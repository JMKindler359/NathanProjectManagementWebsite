<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan's Organization</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>

<body>
    <header class="top-bar">
        <a href="index.html" class="logo">
            <img src="images/leaf_logo.png" alt="Website logo">
            <span>Nathan's Organization</span>
        </a>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="about.html">About & Contact</a>
        </nav>

        <div class="account-actions">
            <a href="signup.html" class="signup-button">Sign up</a>
            <a href="profile.html" class="profile-link">
                <img src="images/blank_profile.png" alt="View your profile">
            </a>
        </div>
    </header>

    <main class="dashboard">
        <section class="welcome">
            <h1>Welcome to your dashboard</h1>
            <p>Here's what's coming up this week.</p>
        </section>

        <section class="dashboard-grid">
            <div class="todo-panel">
                <h2>To-do list</h2>
                <ul class="todo-list" id="todo-list">
                    <!-- Tasks are loaded from the database by tasks.js -->
                </ul>
                <button class="add-task-button" id="add-task-button" type="button">
                    + Add a task
                </button>
            </div>

            <div class="upcoming-panel">
                <h2>Coming up this week</h2>
                <ul class="upcoming-list" id="upcoming-list">
                    <!-- Events are loaded from the database by events.js -->
                </ul>
                <button class="add-task-button" id="add-event-button" type="button">
                    + Add an event
                </button>
            </div>
        </section>
    </main>

    <dialog class="task-dialog" id="task-dialog">
        <form id="task-form" method="dialog">
            <h2>New task</h2>
            <input
                type="text"
                id="task-title"
                placeholder="What is the task?"
                maxlength="255"
                autocomplete="off"
            >
            <p class="dialog-error" id="task-error"></p>
            <div class="dialog-buttons">
                <button type="button" class="dialog-cancel" id="task-cancel">Cancel</button>
                <button type="submit" class="dialog-save">Add task</button>
            </div>
        </form>
    </dialog>

    <dialog class="task-dialog" id="event-dialog">
        <form id="event-form" method="dialog">
            <h2>New event</h2>

            <label for="event-title">Title</label>
            <input
                type="text"
                id="event-title"
                placeholder="What is happening?"
                maxlength="255"
                autocomplete="off"
            >

            <div class="dialog-row">
                <div>
                    <label for="event-date">Date</label>
                    <input type="date" id="event-date">
                </div>
                <div>
                    <label for="event-time">Time (optional)</label>
                    <input type="time" id="event-time">
                </div>
            </div>

            <p class="dialog-error" id="event-error"></p>
            <div class="dialog-buttons">
                <button type="button" class="dialog-cancel" id="event-cancel">Cancel</button>
                <button type="submit" class="dialog-save">Add event</button>
            </div>
        </form>
    </dialog>

    <script src="./JavaScript/tasks.js"></script>
    <script src="./JavaScript/events.js"></script>
</body>
</html>
