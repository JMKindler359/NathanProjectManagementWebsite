<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Nathan's Organization</title>
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo">
            <img src="images/leaf_logo.png" alt="Website logo">
            <span>Nathan's Organization</span>
        </a>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="about.html">About & Contact</a>
        </nav>
    </header>

    <main class="calendar-page">
        <section class="calendar-heading">
            <div>
                <h1>My Calendar</h1>
                <p>Keep track of your schedule and upcoming events.</p>
            </div>

            <button type="button" class="add-event-button" id="add-event-button">
                + Add event
            </button>
        </section>

        <section class="calendar-panel">
            <div class="calendar-month">
                <h2 id="calendar-title"></h2>

                <div class="month-controls">
                    <button type="button" id="prev-month" aria-label="Previous month">
                        &larr;
                    </button>
                    <button type="button" id="next-month" aria-label="Next month">
                        &rarr;
                    </button>
                </div>
            </div>

            <div class="calendar-grid" id="calendar-grid">
                <div class="calendar-day-name">Sun</div>
                <div class="calendar-day-name">Mon</div>
                <div class="calendar-day-name">Tue</div>
                <div class="calendar-day-name">Wed</div>
                <div class="calendar-day-name">Thu</div>
                <div class="calendar-day-name">Fri</div>
                <div class="calendar-day-name">Sat</div>
                <!-- Day cells are generated by events.js -->
            </div>
        </section>
    </main>

    <dialog class="task-dialog" id="event-dialog">
        <form id="event-form" method="dialog">
            <h2>New event</h2>

            <label for="event-title">Title</label>
            <input
                type="text"
                id="event-title"
                placeholder="What is happening?"
                maxlength="255"
                autocomplete="off"
            >

            <div class="dialog-row">
                <div>
                    <label for="event-date">Date</label>
                    <input type="date" id="event-date">
                </div>
                <div>
                    <label for="event-time">Time (optional)</label>
                    <input type="time" id="event-time">
                </div>
            </div>

            <p class="dialog-error" id="event-error"></p>
            <div class="dialog-buttons">
                <button type="button" class="dialog-cancel" id="event-cancel">Cancel</button>
                <button type="submit" class="dialog-save">Add event</button>
            </div>
        </form>
    </dialog>

    <script src="./JavaScript/events.js"></script>
</body>
</html>
